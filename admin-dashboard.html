<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadLens Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── REPLACE THESE WITH YOUR SUPABASE VALUES ── */
  :root {
    --supabase-url: '';
    --supabase-key: '';
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0D0F14;
    --surface: #13161E;
    --surface2: #1A1E28;
    --border: #252A38;
    --accent: #00C9FF;
    --accent2: #FF6B2B;
    --success: #00E5A0;
    --danger: #FF3B5C;
    --text: #E8EAF0;
    --muted: #6B7280;
    --label: #9CA3AF;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-box {
    width: 100%; max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
  }
  .logo-row {
    display: flex; align-items: center; gap: 14px; margin-bottom: 32px;
  }
  .logo-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #000;
    box-shadow: 0 0 30px rgba(0,201,255,0.3);
  }
  .logo-text h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; }
  .logo-text p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .field-group { margin-bottom: 14px; }
  .field-label {
    display: block; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 500; color: var(--label);
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px;
  }
  .field-input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; color: var(--text); font-size: 15px;
    font-family: 'Barlow', sans-serif; outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); color: #000;
    border: none; border-radius: 12px; padding: 13px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    transition: all 0.15s; margin-top: 6px;
  }
  .btn-primary:hover { background: #33D4FF; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; text-align: center; }

  /* ── MAIN APP ── */
  #app { display: none; min-height: 100vh; }

  /* Sidebar */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 24px 16px; position: fixed;
    top: 0; left: 0; bottom: 0; z-index: 10;
  }
  .sidebar-logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 0 6px;
  }
  .sidebar-logo-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); display: flex;
    align-items: center; justify-content: center;
    font-size: 18px; color: #000;
  }
  .sidebar-logo-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 800;
  }
  .sidebar-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; color: var(--muted); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 8px; padding: 0 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; transition: all 0.15s;
    color: var(--muted); font-size: 14px; font-weight: 600;
    margin-bottom: 2px; border: none; background: none;
    width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(0,201,255,0.1); color: var(--accent); }
  .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .user-pill {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
  }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); display: flex;
    align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #000;
    flex-shrink: 0;
  }
  .user-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .user-role { font-size: 10px; color: var(--muted); }
  .sign-out-btn {
    width: 100%; background: transparent; border: 1px solid rgba(255,59,92,0.3);
    color: var(--danger); border-radius: 8px; padding: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    margin-top: 8px; transition: all 0.15s;
  }
  .sign-out-btn:hover { background: rgba(255,59,92,0.08); }

  /* Main content */
  .main-content {
    flex: 1; margin-left: 240px;
    padding: 32px;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* Page header */
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .page-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px; font-weight: 800; letter-spacing: 0.5px;
  }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* Stat cards */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 800; color: var(--accent); line-height: 1.1; margin-top: 4px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Table */
  .table-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  .table-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .table-title { font-size: 15px; font-weight: 700; }
  .table-actions { display: flex; gap: 8px; }
  .btn-sm {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 7px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.accent { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-sm.accent:hover { background: #33D4FF; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid var(--border); }
  th {
    padding: 10px 16px; text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
    font-weight: 500;
  }
  td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(37,42,56,0.5); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .td-biz { font-weight: 600; color: var(--text); }
  .td-muted { color: var(--muted); }

  .status-badge {
    display: inline-block; font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 5px;
    border: 1px solid;
  }
  .status-suspect { background: rgba(0,201,255,0.1); color: var(--accent); border-color: rgba(0,201,255,0.3); }
  .status-new { background: rgba(0,201,255,0.1); color: var(--accent); border-color: rgba(0,201,255,0.3); }
  .status-contacted { background: rgba(255,107,43,0.1); color: var(--accent2); border-color: rgba(255,107,43,0.3); }
  .status-in-progress { background: rgba(255,107,43,0.1); color: var(--accent2); border-color: rgba(255,107,43,0.3); }
  .status-closed { background: rgba(0,229,160,0.1); color: var(--success); border-color: rgba(0,229,160,0.3); }
  .status-not-interested { background: rgba(255,59,92,0.1); color: var(--danger); border-color: rgba(255,59,92,0.3); }

  /* Rep cards */
  .rep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .rep-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .rep-avatar-lg {
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255,107,43,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; color: var(--accent2);
    flex-shrink: 0;
  }
  .rep-info { flex: 1; }
  .rep-info-name { font-size: 15px; font-weight: 700; }
  .rep-info-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .rep-count { text-align: right; }
  .rep-count-num { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; color: var(--accent); }
  .rep-count-label { font-size: 10px; color: var(--muted); }

  /* Search / filter */
  .filter-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 14px; color: var(--text);
    font-size: 14px; font-family: 'Barlow', sans-serif; outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 14px; color: var(--text);
    font-size: 14px; font-family: 'Barlow', sans-serif; outline: none; cursor: pointer;
  }

  /* Loading */
  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .sidebar { width: 200px; }
    .main-content { margin-left: 200px; padding: 20px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- CONFIG: Replace with your Supabase values -->
<script>
  const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
</script>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo-row">
      <div class="logo-mark">◎</div>
      <div class="logo-text">
        <h1>LeadLens</h1>
        <p>Admin Dashboard</p>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Email</label>
      <input id="login-email" class="field-input" type="email" placeholder="admin@company.com">
    </div>
    <div class="field-group">
      <label class="field-label">Password</label>
      <input id="login-password" class="field-input" type="password" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="handleLogin()">Sign In →</button>
    <div id="login-error" class="error-msg"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">◎</div>
        <div class="sidebar-logo-name">LeadLens</div>
      </div>
      <div class="sidebar-label">Navigation</div>
      <button class="nav-item active" onclick="showPage('overview')" id="nav-overview">
        <span class="nav-icon">⊞</span> Overview
      </button>
      <button class="nav-item" onclick="showPage('leads')" id="nav-leads">
        <span class="nav-icon">📋</span> All Leads
      </button>
      <button class="nav-item" onclick="showPage('reps')" id="nav-reps">
        <span class="nav-icon">👥</span> Reps
      </button>
      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar" id="sidebar-avatar">A</div>
          <div>
            <div class="user-name" id="sidebar-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button class="sign-out-btn" onclick="handleSignOut()">Sign Out</button>
      </div>
    </nav>

    <!-- Main -->
    <main class="main-content">

      <!-- Overview -->
      <div class="page active" id="page-overview">
        <div class="page-header">
          <div>
            <div class="page-title">Overview</div>
            <div class="page-sub" id="overview-date"></div>
          </div>
          <button class="btn-sm accent" onclick="exportAllLeads()">↓ Export All</button>
        </div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Total Leads</div>
            <div class="stat-value" id="stat-total">—</div>
            <div class="stat-sub">across all reps</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Reps</div>
            <div class="stat-value" id="stat-reps">—</div>
            <div class="stat-sub">with leads</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">This Week</div>
            <div class="stat-value" id="stat-week">—</div>
            <div class="stat-sub">new leads</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Avg / Rep</div>
            <div class="stat-value" id="stat-avg">—</div>
            <div class="stat-sub">leads per rep</div>
          </div>
        </div>
        <div class="table-card">
          <div class="table-header">
            <div class="table-title">Recent Leads</div>
            <div class="table-actions">
              <button class="btn-sm" onclick="showPage('leads')">View All →</button>
            </div>
          </div>
          <div id="recent-leads-table"><div class="loading"><div class="spinner"></div>Loading...</div></div>
        </div>
      </div>

      <!-- All Leads -->
      <div class="page" id="page-leads">
        <div class="page-header">
          <div>
            <div class="page-title">All Leads</div>
            <div class="page-sub" id="leads-count-sub">Loading...</div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn-sm" onclick="exportAllLeads()">↓ Export Excel</button>
            <button class="btn-sm" onclick="emailAllLeads()">✉ Email Export</button>
          </div>
        </div>
        <div class="filter-row">
          <input class="search-input" id="leads-search" placeholder="Search business, name, city..." oninput="renderLeadsTable()">
          <select class="filter-select" id="leads-status-filter" onchange="renderLeadsTable()">
            <option value="">All Statuses</option>
            <option>Suspect</option><option>New</option><option>Contacted</option>
            <option>In Progress</option><option>Not Interested</option><option>Closed</option>
          </select>
          <select class="filter-select" id="leads-rep-filter" onchange="renderLeadsTable()">
            <option value="">All Reps</option>
          </select>
        </div>
        <div class="table-card">
          <div id="all-leads-table"><div class="loading"><div class="spinner"></div>Loading...</div></div>
        </div>
      </div>

      <!-- Reps -->
      <div class="page" id="page-reps">
        <div class="page-header">
          <div>
            <div class="page-title">Reps</div>
            <div class="page-sub" id="reps-count-sub">Loading...</div>
          </div>
        </div>
        <div id="reps-grid" class="rep-grid"><div class="loading"><div class="spinner"></div>Loading...</div></div>
      </div>

    </main>
  </div>
</div>

<script>
let sb, currentUser, allLeads = [], allProfiles = [];

// ── INIT ──
window.addEventListener('DOMContentLoaded', async () => {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  document.getElementById('overview-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadApp();
  }
});

// ── AUTH ──
async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  document.getElementById('login-error').textContent = '';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('login-error').textContent = error.message; return; }

  const { data: profile } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
  if (profile?.role !== 'admin') {
    await sb.auth.signOut();
    document.getElementById('login-error').textContent = 'Admin access required.';
    return;
  }

  currentUser = data.user;
  await loadApp();
}

async function handleSignOut() {
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ── LOAD APP ──
async function loadApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  document.getElementById('sidebar-name').textContent = profile?.rep_name || currentUser.email;
  document.getElementById('sidebar-avatar').textContent = (profile?.rep_name || 'A')[0].toUpperCase();

  await Promise.all([fetchLeads(), fetchProfiles()]);
  renderOverview();
  renderLeadsTable();
  renderReps();
}

async function fetchLeads() {
  const { data } = await sb.from('leads').select('*').order('created_at', { ascending: false });
  allLeads = data || [];
}

async function fetchProfiles() {
  const { data } = await sb.from('profiles').select('*');
  allProfiles = data || [];
}

// ── PAGES ──
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
}

// ── OVERVIEW ──
function renderOverview() {
  document.getElementById('stat-total').textContent = allLeads.length;
  const repsWithLeads = new Set(allLeads.map(l => l.rep_id)).size;
  document.getElementById('stat-reps').textContent = repsWithLeads;
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  const thisWeek = allLeads.filter(l => new Date(l.created_at) > weekAgo).length;
  document.getElementById('stat-week').textContent = thisWeek;
  document.getElementById('stat-avg').textContent = repsWithLeads ? (allLeads.length / repsWithLeads).toFixed(1) : 0;

  const recent = allLeads.slice(0, 10);
  document.getElementById('recent-leads-table').innerHTML = buildLeadsTable(recent);
}

// ── LEADS TABLE ──
function renderLeadsTable() {
  const search = document.getElementById('leads-search').value.toLowerCase();
  const statusFilter = document.getElementById('leads-status-filter').value;
  const repFilter = document.getElementById('leads-rep-filter').value;

  let filtered = allLeads.filter(l => {
    const matchSearch = !search || [l.business_name, l.poc_first, l.poc_last, l.city, l.phone, l.email]
      .some(f => (f || '').toLowerCase().includes(search));
    const matchStatus = !statusFilter || l.status === statusFilter;
    const matchRep = !repFilter || l.rep_id === repFilter;
    return matchSearch && matchStatus && matchRep;
  });

  document.getElementById('leads-count-sub').textContent = `${filtered.length} leads`;
  document.getElementById('all-leads-table').innerHTML = buildLeadsTable(filtered);

  // Populate rep filter
  const repSel = document.getElementById('leads-rep-filter');
  const current = repSel.value;
  repSel.innerHTML = '<option value="">All Reps</option>';
  allProfiles.forEach(p => {
    repSel.innerHTML += `<option value="${p.id}" ${current === p.id ? 'selected' : ''}>${p.rep_name}</option>`;
  });
  repSel.value = current;
}

function buildLeadsTable(leads) {
  if (!leads.length) return '<div class="loading" style="padding:32px">No leads found.</div>';
  return `<table><thead><tr>
    <th>#</th><th>Business</th><th>Contact</th><th>Phone</th>
    <th>City / State</th><th>Status</th><th>Rep</th><th>Date</th>
  </tr></thead><tbody>` +
  leads.map((l, i) => `<tr>
    <td class="td-muted">${i + 1}</td>
    <td class="td-biz">${l.business_name || '—'}</td>
    <td class="td-muted">${[l.poc_first, l.poc_last].filter(Boolean).join(' ') || '—'}</td>
    <td class="td-muted">${l.phone || '—'}</td>
    <td class="td-muted">${[l.city, l.state].filter(Boolean).join(', ') || '—'}</td>
    <td><span class="status-badge status-${(l.status || '').toLowerCase().replace(/\s+/g, '-')}">${l.status || '—'}</span></td>
    <td class="td-muted">${l.rep_name || '—'}</td>
    <td class="td-muted">${new Date(l.created_at).toLocaleDateString()}</td>
  </tr>`).join('') + '</tbody></table>';
}

// ── REPS ──
function renderReps() {
  const repLeadCounts = {};
  allLeads.forEach(l => { repLeadCounts[l.rep_id] = (repLeadCounts[l.rep_id] || 0) + 1; });

  document.getElementById('reps-count-sub').textContent = `${allProfiles.length} reps`;
  document.getElementById('reps-grid').innerHTML = allProfiles.map(p => `
    <div class="rep-card">
      <div class="rep-avatar-lg">${(p.rep_name || '?')[0].toUpperCase()}</div>
      <div class="rep-info">
        <div class="rep-info-name">${p.rep_name || '—'}</div>
        <div class="rep-info-sub">Branch ${p.branch_num} · EMP ${p.employee_num}</div>
        ${p.territory ? `<div class="rep-info-sub">${p.territory}</div>` : ''}
      </div>
      <div class="rep-count">
        <div class="rep-count-num">${repLeadCounts[p.id] || 0}</div>
        <div class="rep-count-label">leads</div>
      </div>
    </div>
  `).join('') || '<div class="loading">No reps found.</div>';
}

// ── EXPORT ──
const HEADERS = [
  'Employee #','Branch','Route','Status','PropertyDescription','PropertyType',
  'BusinessName','FirstName','LastName','Salutation','Phone','Type','Email',
  'StreetNum','StreetName','AddressLine2','City','State','Zip',
  'Instructions/Comments','Prospect Source Category','Prospect Source','CampaignId'
];

function buildRow(l) {
  return [
    l.employee_num, l.branch_num, '', l.status, '', l.property_type,
    l.business_name, l.poc_first, l.poc_last, '', l.phone, '', l.email,
    l.street_number, l.street_name, l.address_line2, l.city, l.state, l.zip,
    '', '', '', ''
  ];
}

function exportAllLeads() {
  const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...allLeads.map(buildRow)]);
  ws['!cols'] = HEADERS.map(h => ({ wch: Math.max(h.length + 2, 12) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sales Module Import Template');
  XLSX.writeFile(wb, `LeadLens_AllReps_${new Date().toISOString().slice(0,10)}.xlsx`);
}
</script>
